<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075e54">
    <link rel="manifest" href="./manifest.json">
    <title>Chaos Organizer</title>
</head>

<body>

    <div id="chat-workspace-app">

        <!-- WHATSAPP STYLE HEADER BAR -->
        <div class="chat-header-top-bar">
            <div class="chat-header-user-info">
                <div class="header-avatar-circle">🤖</div>
                <div class="header-text-metadata">
                    <span class="header-profile-name">Chaos Organizer Bot</span>
                    <span class="header-status-indicator">online</span>
                </div>
            </div>
            <div class="header-actions-suite">
                <input type="text" id="chat-search-messages-input" class="header-search-field"
                    placeholder="Search message..." />
                <button class="btn-header-icon" id="btn-trigger-search-toggle" title="Search messages">🔍</button>
                <button class="btn-header-icon" id="btn-trigger-media-menu-toggle" title="Media Attachments">⋮</button>
            </div>
        </div>

        <!-- 📌 TOP PINNED MESSAGE BANNER (PINNED BAR) -->
        <div id="pinned-message-bar">
            <div>
                <div class="pin-label-text">Pinned Message</div>
                <div id="pinned-content-preview-text" class="pin-content-preview">No message pinned yet.</div>
            </div>
            <button class="btn-unpin-cross" id="btn-trigger-unpin" title="Unpin">×</button>
        </div>

        <!-- CATEGORIES POP-UP MENU -->
        <div id="media-categories-popover-panel" class="media-popover-hidden">
            <div class="media-menu-header-title">Attachments Meta</div>
            <div class="media-category-menu-item" data-filter="all">🔄 All Messages <span class="badge-count-inline"
                    id="cnt-all">0</span></div>
            <div class="media-category-menu-item" data-filter="image">🖼️ Images <span class="badge-count-inline"
                    id="cnt-image">0</span></div>
            <div class="media-category-menu-item" data-filter="audio">🎵 Audio & Voices <span class="badge-count-inline"
                    id="cnt-audio">0</span></div>
            <div class="media-category-menu-item" data-filter="video">🎥 Videos <span class="badge-count-inline"
                    id="cnt-video">0</span></div>
            <div class="media-category-menu-item" data-filter="file">📄 Binary Files <span class="badge-count-inline"
                    id="cnt-file">0</span></div>
            <div class="media-category-menu-item" data-filter="url">🔗 Links & URLs <span class="badge-count-inline"
                    id="cnt-url">0</span></div>
        </div>

        <!-- TIMELINE VIEWPORT -->
        <div id="chat-history-viewport">
            <!-- Dynamic messages -->
        </div>

        <!-- 😊 EMOJI POP-UP MENU (HIDDEN BY DEFAULT) -->
        <div id="emojis-popover-panel" class="emojis-popover-hidden">
            <span class="emoji-picker-item">😀</span>
            <span class="emoji-picker-item">😂</span>
            <span class="emoji-picker-item">😊</span>
            <span class="emoji-picker-item">🚀</span>
            <span class="emoji-picker-item">🔥</span>
            <span class="emoji-picker-item">👍</span>
            <span class="emoji-picker-item">🎉</span>
            <span class="emoji-picker-item">🤖</span>
            <span class="emoji-picker-item">💼</span>
            <span class="emoji-picker-item">💯</span>
        </div>

        <!-- INTERACTIVE FOOTER BAR -->
        <div id="footer-normal-controls-wrapper" style="display: flex; align-items: center; width: 100%; gap: 12px;">
            <button class="btn-footer-action" id="btn-trigger-emojis" title="Insert Emoji">😀</button>
            <input type="text" id="chat-core-text-input" class="chat-core-input"
                placeholder="Write a message or use @chaos:..." autocomplete="off" />
            <button class="btn-footer-action" id="btn-trigger-clip-upload" title="Upload File">📎</button>
            <input type="file" id="hidden-clip-file-input" style="display: none;" />
            <button class="btn-footer-action" id="btn-trigger-voice-rec" title="Record Voice Message">🎤</button>
            <button class="btn-footer-action" id="btn-trigger-direct-send" title="Send Message"
                style="display: none;">▶️</button>
        </div>

        <!-- CATEGORY VIEW MODE (HIDDEN BY DEFAULT) -->
        <div id="footer-category-view-mode-wrapper"
            style="display: none; align-items: center; width: 100%; justify-content: space-between;">
            <button class="btn-footer-action" id="btn-trigger-back-to-general" title="Back to General Chat"
                style="color: #075e54; font-weight: bold; font-size: 20px;">⬅️</button>
            <div style="font-size: 14px; font-weight: bold; color: #4a5568; background: #edf2f7; padding: 6px 16px; border-radius: 20px;"
                id="text-display-active-category">
                Viewing: Images 🖼️
            </div>
            <div style="width: 34px;"></div> <!-- Symmetry fill -->
        </div>

        <!-- VOICE RECORDING PANEL -->
        <div id="voice-recorder-active-panel">
            <button class="btn-rec-control btn-confirm" id="btn-save-voice-rec">✓</button>
            <div class="voice-timer-display" id="voice-live-timer">00:00</div>
            <button class="btn-rec-control btn-cancel" id="btn-cancel-voice-rec">✕</button>
        </div>

    </div>

    <!-- GLOBAL DRAG & DROP MASK -->
    <div id="global-drag-overlay-mask">Drop files here to upload into the channel...</div>

</body>

</html>
